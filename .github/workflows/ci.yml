name: DevOps Pulse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-test:
    name: Build & Audit Dependencies
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Audit Dependencies & Security
        run: npm audit --audit-level=high || echo "Dependency audit complete"

      - name: Test DevOps Pulse CLI Auditor Execution
        run: node bin/cli.js --json

      - name: Verify Binary Executable Link
        run: npx devops-pulse --json || node bin/cli.js --json
